      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-memory"] = tl;

      const title = get("03-memory-title");
      const cursor = get("03-memory-cursor");
      const titleStates = [
        { t: 0.0, text: "MARKET" },
        { t: 0.38, text: "MARKET MEM" },
        { t: 0.72, text: "MARKET MEMRY" },
        { t: 1.02, text: "MARKET MEM" },
        { t: 1.34, text: "MARKET MEMORY" },
        { t: 2.16, text: "MARKET MEMORY ✓" },
        { t: 10.1, text: "SKIPPED" },
        { t: 10.54, text: "SKIPPED ≠" },
        { t: 10.96, text: "SKIPPED ≠ FORGOT" },
        { t: 11.24, text: "SKIPPED ≠ FORGO" },
        { t: 11.56, text: "SKIPPED ≠ FORGOTTEN" },
      ];
      const textAt = (time) => {
        for (let index = titleStates.length - 1; index >= 0; index -= 1) {
          if (time >= titleStates[index].t) return titleStates[index].text;
        }
        return "";
      };

      const titleDriver = { t: 0 };
      const blinkDriver = { p: 0 };
      title.textContent = textAt(0);

      const drawPath = (id, start, duration) => {
        const path = get(id);
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
        tl.to(path, { strokeDashoffset: 0, duration, ease: "power2.out" }, start);
      };

      [
        "03-memory-end-mon",
        "03-memory-end-tue",
        "03-memory-end-wed",
        "03-memory-end-thu",
        "03-memory-end-fri",
      ].forEach((id) => gsap.set(get(id), { opacity: 0, scale: 0.4, transformOrigin: "center" }));

      tl.fromTo(get("03-memory-stage"), { x: -12 }, { x: 0, duration: 13, ease: "none" }, 0);
      tl.fromTo(get("03-memory-kicker"), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.08);
      tl.fromTo(get("03-memory-title-wrap"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" }, 0.06);
      tl.to(titleDriver, {
        t: 13,
        duration: 13,
        ease: "none",
        onUpdate: () => {
          title.textContent = textAt(titleDriver.t);
        },
      }, 0);
      tl.to(blinkDriver, {
        p: Math.PI * 38,
        duration: 13,
        ease: "none",
        onUpdate: () => {
          cursor.style.opacity = titleDriver.t < 11.9 && Math.sin(blinkDriver.p) > 0 ? "1" : "0";
        },
      }, 0);

      drawPath("03-memory-rail-path", 0.18, 1.34);
      tl.fromTo(get("03-memory-rail-label"), { opacity: 0, y: 20 }, { opacity: 0.74, y: 0, duration: 0.5, ease: "power1.out" }, 0.45);

      tl.fromTo(get("03-memory-mon"), { opacity: 0, scale: 0.38, rotation: -26 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.66, ease: "back.out(1.35)" }, 0.88);

      tl.fromTo(get("03-memory-ownership-label"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.44, ease: "power2.out" }, 2.42);

      tl.fromTo(get("03-memory-day-tue"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.2);
      tl.fromTo(get("03-memory-tue"), { opacity: 0, scale: 0.42, rotation: -18 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.58, ease: "back.out(1.25)" }, 3.38);
      drawPath("03-memory-own-tue", 3.84, 0.72);
      tl.to(get("03-memory-end-tue"), { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 4.4);

      tl.fromTo(get("03-memory-day-wed"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 4.72);
      tl.fromTo(get("03-memory-wed"), { opacity: 0, scale: 0.42, rotation: -18 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.58, ease: "back.out(1.25)" }, 4.9);

      tl.fromTo(get("03-memory-cooldown-band"), { opacity: 0, scaleX: 0, transformOrigin: "left center" }, { opacity: 1, scaleX: 1, duration: 1.04, ease: "power2.out" }, 6.58);
